version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: companyos-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: companyos
      POSTGRES_PASSWORD: companyos
      POSTGRES_DB: companyos_ai
    ports:
      - "5432:5432"
    volumes:
      - companyos_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U companyos -d companyos_ai"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: companyos-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"

volumes:
  companyos_db_data:
